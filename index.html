<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lark Bowen - Repertoire Dashboard</title>

  <!-- PapaParse for live Google Sheet CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --primary-color: #60a5fa;
      --primary-accent: #3b82f6;
      --header-bg: #0f172a;
      --panel-bg: #1e293b;
      --page-bg: #0b0f19;
      --border-color: #334155;
      --table-header-bg: #0f172a;
      --table-header-text: #f8fafc;
      --row-even: #1e293b;
      --row-odd: #172033;
      --row-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --badge-bg: #334155;
      --badge-text: #e2e8f0;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--page-bg);
      color: var(--text-main);
      padding-bottom: 50px;
    }

    /* Top Navigation / Branding */
    header {
      background: var(--header-bg);
      color: #ffffff;
      padding: 1.25rem 1rem;
      border-bottom: 3px solid var(--primary-accent);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand-title h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #f8fafc;
    }

    .brand-title p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #38bdf8;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    /* Main Container */
    .container {
      max-width: 1100px;
      margin: 1.5rem auto 0 auto;
      padding: 0 1rem;
    }

    /* Dashboard Control Panel */
    .dashboard-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .panel-header {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .controls-grid {
        grid-template-columns: 1.5fr 1fr 1fr;
      }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .control-group input,
    .control-group select {
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.9rem;
      background-color: #0f172a;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s;
    }

    .control-group input:focus,
    .control-group select:focus {
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    .filter-options-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-main);
    }

    .results-count {
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Dashboard Data Table */
    .table-container {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: var(--table-header-bg);
      color: var(--table-header-text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 12px 16px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 12px 16px;
      font-size: 0.92rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
    }

    tr:nth-child(even) {
      background-color: var(--row-even);
    }

    tr:nth-child(odd) {
      background-color: var(--row-odd);
    }

    tr:hover {
      background-color: var(--row-hover);
    }

    .artist-cell {
      font-weight: 600;
      color: #f8fafc;
      width: 38%;
    }

    .song-cell {
      color: #cbd5e1;
      width: 42%;
    }

    .tag-cell {
      width: 20%;
      text-align: right;
    }

    .genre-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--badge-bg);
      color: var(--badge-text);
      margin: 2px 2px;
      white-space: nowrap;
      border: 1px solid #475569;
    }

    .not-ready-badge {
      background: #7f1d1d;
      color: #fca5a5;
      border-color: #991b1b;
    }

    /* Mobile Responsive Layout */
    @media (max-width: 640px) {
      .table-container table, 
      .table-container thead, 
      .table-container tbody, 
      .table-container th, 
      .table-container td, 
      .table-container tr {
        display: block;
      }

      .table-container thead {
        display: none;
      }

      .table-container tr {
        margin-bottom: 10px;
        border-bottom: 2px solid var(--border-color);
        padding: 12px;
      }

      .table-container td {
        padding: 4px 0;
        border: none;
        width: 100% !important;
        text-align: left !important;
      }

      .artist-cell {
        font-size: 0.88rem;
        color: var(--text-muted);
      }

      .song-cell {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 4px;
      }

      .tag-cell {
        margin-top: 6px;
      }
    }

    .empty-message {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="brand-title">
        <h1>Lark Bowen Song List</h1>
        <p>Dashboard V2 Repertoire & Setlist Viewer</p>
      </div>
      <div class="header-actions">
        <span class="sync-pill" id="syncStatus">
          <span class="sync-dot"></span> Live Sync Enabled
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">

    <!-- Dashboard Filter & Sort Panel -->
    <section class="dashboard-panel">
      <div class="panel-header">
        <i class="ph ph-sliders-horizontal"></i> Dashboard Controls
      </div>

      <div class="controls-grid">
        <!-- Search Input -->
        <div class="control-group">
          <label for="searchInput"><i class="ph ph-magnifying-glass"></i> Search (Artist or Song)</label>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Type artist name or song title..." 
            autocomplete="off" 
          />
        </div>

        <!-- Genre Dropdown -->
        <div class="control-group">
          <label for="genreSelect"><i class="ph ph-music-note"></i> Genre</label>
          <select id="genreSelect">
            <option value="ALL">All Genres</option>
            <option value="70's and before">70's and before</option>
            <option value="80's">80's</option>
            <option value="90's">90's</option>
            <option value="Adult Contemporary">Adult Contemporary</option>
            <option value="Alternative/Indie">Alternative/Indie</option>
            <option value="Animated">Animated</option>
            <option value="Blues/Soft Rock">Blues/Soft Rock</option>
            <option value="Broadway">Broadway</option>
            <option value="Classical">Classical</option>
            <option value="Country">Country</option>
            <option value="Dance/Electronic">Dance/Electronic</option>
            <option value="Holidays">Holidays</option>
            <option value="Love">Love</option>
            <option value="Movies">Movies</option>
            <option value="Pop">Pop</option>
            <option value="R&B">R&B</option>
            <option value="Religious">Religious</option>
            <option value="Risqũe">Risqũe</option>
            <option value="Rock">Rock</option>
          </select>
        </div>

        <!-- Sort Option Dropdown -->
        <div class="control-group">
          <label for="sortSelect"><i class="ph ph-arrows-down-up"></i> Sort Options</label>
          <select id="sortSelect">
            <option value="artist-asc">Artist (A → Z)</option>
            <option value="artist-desc">Artist (Z → A)</option>
            <option value="song-asc">Song Title (A → Z)</option>
            <option value="song-desc">Song Title (Z → A)</option>
          </select>
        </div>
      </div>

      <div class="filter-options-bar">
        <label class="toggle-label">
          <input type="checkbox" id="hideNotReady" checked />
          Hide "Not Ready" songs
        </label>
        <span class="results-count" id="resultsCount">Loading songs...</span>
      </div>
    </section>

    <!-- Song Table View -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Artist</th>
            <th>Song Title</th>
            <th style="text-align: right;">Tags / Genre</th>
          </tr>
        </thead>
        <tbody id="songTableBody">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>

  </main>

  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYoNFMsjKUWEcHlDlBuKYvPgbaG3IFtTJ-An1rGdAyc5IZRKNpe_wMSkdH0xs8QBzlk-AELcqn3i7N/pub?gid=0&single=true&output=csv";

    const KNOWN_GENRES = [
      "Pop", "Rock", "80's", "Country", "Risqũe", "Holidays",
      "Broadway", "Movies", "90's", "Animated", "Alternative/Indie",
      "R&B", "Adult Contemporary", "Love", "Blues/Soft Rock",
      "70's and before", "Classical", "Dance/Electronic", "Religious"
    ];

    let masterSongData = [];

    const searchInput = document.getElementById('searchInput');
    const genreSelect = document.getElementById('genreSelect');
    const sortSelect = document.getElementById('sortSelect');
    const hideNotReady = document.getElementById('hideNotReady');
    const songTableBody = document.getElementById('songTableBody');
    const resultsCount = document.getElementById('resultsCount');
    const syncStatus = document.getElementById('syncStatus');

    function fetchMasterSheet() {
      syncStatus.innerHTML = `<span class="sync-dot" style="background:#eab308; box-shadow:0 0 6px #eab308;"></span> Syncing...`;

      Papa.parse(GOOGLE_SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          parseRows(results.data);
          syncStatus.innerHTML = `<span class="sync-dot"></span> Live Synced`;
        },
        error: function(err) {
          console.error("Fetch failed:", err);
          syncStatus.innerHTML = `<span class="sync-dot" style="background:#ef4444; box-shadow:0 0 6px #ef4444;"></span> Sync Error`;
          resultsCount.textContent = "Error loading data from Google Sheet.";
        }
      });
    }

    function parseRows(rows) {
      masterSongData = rows.map(row => {
        const activeGenres = [];
        KNOWN_GENRES.forEach(genre => {
          if (row[genre] && row[genre].toString().trim().toUpperCase() === "TRUE") {
            activeGenres.push(genre);
          }
        });

        const isNotReady = (row["Not Ready"] && row["Not Ready"].toString().trim().toUpperCase() === "TRUE");

        return {
          artist: row["Artist"] ? row["Artist"].trim() : "",
          title: row["Song Title"] ? row["Song Title"].trim() : (row["Song"] ? row["Song"].trim() : ""),
          genres: activeGenres,
          notReady: isNotReady
        };
      }).filter(item => item.title !== "" || item.artist !== "");

      render();
    }

    function render() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const selectedGenre = genreSelect.value;
      const sortMode = sortSelect.value;
      const shouldHideNotReady = hideNotReady.checked;

      let filtered = masterSongData.filter(item => {
        if (shouldHideNotReady && item.notReady) return false;
        if (selectedGenre !== "ALL" && !item.genres.includes(selectedGenre)) return false;
        if (searchTerm) {
          const matchArtist = item.artist.toLowerCase().includes(searchTerm);
          const matchSong = item.title.toLowerCase().includes(searchTerm);
          return matchArtist || matchSong;
        }
        return true;
      });

      filtered.sort((a, b) => {
        switch (sortMode) {
          case 'artist-asc':
            return a.artist.localeCompare(b.artist) || a.title.localeCompare(b.title);
          case 'artist-desc':
            return b.artist.localeCompare(a.artist) || a.title.localeCompare(b.title);
          case 'song-asc':
            return a.title.localeCompare(b.title) || a.artist.localeCompare(b.artist);
          case 'song-desc':
            return b.title.localeCompare(a.title) || a.artist.localeCompare(b.artist);
          default:
            return 0;
        }
      });

      resultsCount.textContent = `Showing ${filtered.length} song${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        songTableBody.innerHTML = `
          <tr>
            <td colspan="3" class="empty-message">
              No matching songs found in repertoire.
            </td>
          </tr>
        `;
        return;
      }

      songTableBody.innerHTML = filtered.map(song => `
        <tr>
          <td class="artist-cell">${escapeHtml(song.artist)}</td>
          <td class="song-cell">${escapeHtml(song.title)}</td>
          <td class="tag-cell">
            ${song.notReady ? '<span class="genre-badge not-ready-badge">Not Ready</span>' : ''}
            ${song.genres.map(g => `<span class="genre-badge">${escapeHtml(g)}</span>`).join('')}
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    searchInput.addEventListener('input', render);
    genreSelect.addEventListener('change', render);
    sortSelect.addEventListener('change', render);
    hideNotReady.addEventListener('change', render);

    fetchMasterSheet();
  </script>
</body>
</html>
